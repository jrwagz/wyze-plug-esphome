name: Validate ESPHome configs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.11.0"
      - name: Set up dummy secrets
        run: cp tests/secrets.yaml.example tests/secrets.yaml
      - name: Validate test configs
        run: |
          for f in tests/test-*.yaml; do
            echo "--- Validating $f"
            esphome config "$f" > /dev/null
          done
